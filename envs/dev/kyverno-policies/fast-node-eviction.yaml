apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: fast-node-eviction
  annotations:
    policies.kyverno.io/title: Fast Node Eviction Tolerations
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Injects aggressive tolerations (15s) for NotReady and Unreachable nodes
      to ensure fast pod failover in dev environments with Spot instances.
spec:
  mutateExistingOnPolicyUpdate: false
  rules:
  - name: inject-fast-eviction-tolerations
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - dev
    mutate:
      patchStrategicMerge:
        spec:
          +(tolerations):
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 15
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 15