apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: java-instrumentation
  namespace: dev
spec:
  exporter:
    endpoint: http://otel-collector-collector.monitoring.svc.cluster.local:4318
  java:
    env:
    - name: OTEL_METRICS_EXPORTER
      value: prometheus
    - name: OTEL_EXPORTER_PROMETHEUS_PORT
      value: "9464"
    - name: OTEL_EXPORTER_PROMETHEUS_HOST
      value: 0.0.0.0
    - name: OTEL_INSTRUMENTATION_SPRING_WEBMVC_EXCLUDE_PATTERNS
      value: "/actuator/**,/swagger-ui/**,/v3/api-docs/**"
    - name: OTEL_INSTRUMENTATION_SPRING_WEBFLUX_EXCLUDE_PATTERNS
      value: "/actuator/**,/swagger-ui/**,/v3/api-docs/**"
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.23.0
    resources:
      limits:
        cpu: 500m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 64Mi
  propagators:
  - tracecontext
  - baggage
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: nodejs-instrumentation
  namespace: dev
spec:
  exporter:
    endpoint: http://otel-collector-collector.monitoring.svc.cluster.local:4318
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.52.1
  propagators:
  - tracecontext
  - baggage