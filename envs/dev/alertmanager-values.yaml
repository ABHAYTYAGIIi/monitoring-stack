config:
  global: {}
  receivers:
  - name: default-receiver
  - name: teams-receiver
    msteams_configs:
    - webhook_url_file: "/etc/secrets/alertmanager-teams-webhook/webhook_url"
      send_resolved: true
  route:
    group_by: ['alertname', 'severity', 'namespace', 'pod', 'deployment']
    group_interval: 5m
    group_wait: 10s
    receiver: teams-receiver
    repeat_interval: 3h

extraSecretMounts:
  - name: alertmanager-teams-webhook
    secretName: alertmanager-teams-webhook
    mountPath: /etc/secrets/alertmanager-teams-webhook
    readOnly: true